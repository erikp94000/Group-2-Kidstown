<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Toy Store JavaScript Test</title>
</head>
<body>
    <h1>Toy Store Test</h1>

    <div id="riddle-display" style="white-space: pre-line;"></div>
    <br>
    <button id="answer-button">Click here for the answer.</button>
    <div id="answer-display" style="white-space: pre-line;"></div>

    <button id="shape-button" hidden>
        Click here to see the shape poems.
    </button>

    <button id="problem-button" hidden>
        Click here to read the problem.
    </button>

        Click here to see the available tools.

        Click here to see one answer.
    </button>

    <button id="next-button" hidden>Click here to try another riddle.</button>

    <button id="next-shape-button" hidden>
        Click here for your next shape poem.
    </button>

    <script src="toystore.js"></script>
