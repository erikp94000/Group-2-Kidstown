<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zoo JavaScript Test</title>
</head>
<body>

    <h1>KidsTown Zoo Test</h1>

    <div id="zoo-display" style="white-space: pre-line;"></div>

    <img id="world-map-image"
     src="../../graphics/zoo/world3a.gif"
     alt="World Map"
     hidden>
     <br>

    <button id="map-button">World Map</button>
    <button id="ocean-button">Ocean</button>
    <button id="africa-button">Africa</button>
    <button id="australia-button">Australia</button>
    <button id="polar-button">Polar Regions</button>
    <br><br>

    <button id="challenge-button" hidden>
        Try taking the Zoo Keeper's Challenge!
    </button>

    <button id="zoo-home-button" hidden>
        Go back to the Zoo.
    </button>

    <div id="challenge-options"></div>

    <script src="zoo.js"></script>
</body>
</html>
